<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
html,body{width:100%;height:100%;margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#12395c}
main{height:100%;display:grid;place-items:center;padding:30px;box-sizing:border-box}
.wrap{width:min(680px,92vw);text-align:center}
img{display:block;max-width:100%;margin:0 auto}
.ministry{margin-top:26px;background:#103d5c;border-radius:16px;padding:14px}
h1{font-size:28px;margin:22px 0 4px}.sub{font-size:14px;color:#5f7382}.loader{width:56px;height:4px;border-radius:99px;background:#d8e1e8;overflow:hidden;margin:22px auto 0}.loader:after{content:"";display:block;width:45%;height:100%;background:#12395c;animation:a 1s ease-in-out infinite alternate}@keyframes a{from{transform:translateX(0)}to{transform:translateX(70px)}}
</style>
</head>
<body><main><div class="wrap">
<img src="brand-escuela-maestros.svg" alt="Escuela de Maestros">
<h1>PCI Secundaria Aprende</h1>
<div class="sub">Versión Windows · r37 · Modo offline</div>
<div class="ministry"><img src="brand-ministerio.svg" alt="Ministerio de Educación · Buenos Aires Ciudad"></div>
<div class="loader"></div>
</div></main></body></html>
