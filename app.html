<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12395c">
<title>PCI Secundaria Aprende V2</title>
</head>
<body>
<p style="font-family:system-ui;padding:24px">Cargando PCI Secundaria Aprende V2…</p>
<script>
(async()=>{
  const VERSION='20260911-44';
  const modulePaths=[
    'src/v19-map.js','src/v20-format-order.js','src/v21-custom-social-ui.js','src/v22-teachers.js',
    'src/v23-prearm.js','src/v24-social-interactions.js','src/v25-institutional-spaces.js','src/v26-other-formats-print.js',
    'src/v29-fo-rules.js','src/v30-fo-minimum-guard.js','src/v31-integration-hours-print.js','src/v32-phase2-entry-fix.js',
    'src/v38-phase2-workspace.js','src/v39-elective-plans.js','src/v42-homologacion-performance.js'
  ];
  const fetchText=async url=>{
    const response=await fetch(`${url}?v=${VERSION}`,{cache:'force-cache'});
    if(!response.ok)throw new Error(`No se pudo cargar ${url}.`);
    return response.text();
  };
  const inline=source=>'<script>'+String(source).replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>\n';

  try{
    const [htmlRaw,phase2Raw,...moduleSources]=await Promise.all([
      fetchText('app-core.html'),
      fetchText('src/v28-phase2-matrix.js'),
      ...modulePaths.map(fetchText)
    ]);

    let html=htmlRaw;
    let phase2Source=phase2Raw;
    phase2Source=phase2Source
      .replace("'Agro y Ambiente':{dcj:true}","'Agro y Ambiente':{f:'agro_ambiente',dcj:true}")
      .replace("if(m.dcj)return[];","")
      .replace("data/orientaciones/${m.f}.txt?v=20260911-28","data/orientaciones/${m.f}.txt?v=20260911-44")
      .replace("const FGFILES=['db1.txt','db2.txt','db3.txt','db4.txt','rest1.txt','rest2.txt','rest3.txt','rest4.txt','rest5.txt'].map(x=>`/Matriz-PCI-Completa/data/${x}`);","const FGFILES=['db1.txt','db2.txt','db3.txt','db4.txt','rest1.txt','rest2.txt','rest3.txt','rest4.txt','rest5.txt'].map(x=>`data/formacion_general/${x}?v=20260911-44`);")
      .replace("<button data-src=\"FO\" ${m.dcj?'disabled':''}>${esc2(state.active)}</button>","<button data-src=\"FO\">${esc2(state.active)}</button>")
      .replace("<strong>Contenidos priorizados${d.elective?' · compartidos A/B':''}</strong>","<strong>${(ORI[state.active]||{}).dcj?'Contenidos del Diseño Curricular':'Contenidos priorizados'}${d.elective?' · compartidos A/B':''}</strong>")
      .replace("function allowed(c,g){if(isOther(g))return true;if(c.component==='FO')return hasFO(g);return members(g).filter(s=>s.origin==='FG').some(s=>subjectMatch(c,s.name))}","function allowed(c,g){if(isOther(g))return true;if(c.component==='CUSTOM')return c.groupId===g.id;if(c.component==='FO')return hasFO(g);return members(g).filter(s=>s.origin==='FG').some(s=>subjectMatch(c,s.name))}")
      .replace("const oriContents=()=>FO.get(fkey())||[],findContent=id=>[...(FG||[]),...oriContents()].find(c=>c.id===id)","const oriContents=()=>FO.get(fkey())||[],customContents=()=>{const x=p2();x.customContents=Array.isArray(x.customContents)?x.customContents:[];return x.customContents},findContent=id=>[...(FG||[]),...oriContents(),...customContents()].find(c=>c.id===id)")
      .replace("function pool(a){const gs=ga(a);return[...(FG||[]),...oriContents()].filter(c=>gs.some(g=>allowed(c,g)))}","function pool(a){const gs=ga(a),tg=gb(targetGroup),scope=tg&&tg.area===a?[tg]:gs;return[...(FG||[]),...oriContents()].filter(c=>scope.some(g=>allowed(c,g)))}")
      .replace("function home(){if(!$('v28home'))shell();","function home(){window.__pciEnsurePrearm?.();if(!$('v28home'))shell();")
      .replace("function renderBag(){const base=pool(activeArea).filter(c=>source==='ALL'||c.component===source),se=$('v28subject'),ae=$('v28axis');","function renderBag(){const scoped=pool(activeArea),availableComponents=new Set(scoped.map(c=>c.component));if(source!=='ALL'&&!availableComponents.has(source))source='ALL';$('v28board')?.querySelectorAll('[data-src]').forEach(t=>{const s=t.dataset.src;t.hidden=s!=='ALL'&&!availableComponents.has(s);t.classList.toggle('on',s===source)});const base=scoped.filter(c=>source==='ALL'||c.component===source),se=$('v28subject'),ae=$('v28axis');")
      .replace("targetGroup=id;renderGroups();selectionBar()","targetGroup=id;source='ALL';$('v28board').querySelectorAll('[data-src]').forEach(t=>t.classList.toggle('on',t.dataset.src==='ALL'));renderGroups();renderBag();selectionBar()")
      .replace("host.querySelectorAll('[data-elec]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleElective(x.dataset.elec)})}","host.querySelectorAll('[data-elec]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleElective(x.dataset.elec)});window.dispatchEvent(new Event('pci-phase2-groups-rendered'))}")
      .replace("selectionBar()}","selectionBar();window.dispatchEvent(new Event('pci-phase2-bag-rendered'))}")
      .replace("const baseInit=window.__pciBaseInit;","window.PCIPhase2V28={p2,groups,gb,findContent,renderGroups,renderBag,save,members,typeLabel,termText,getActiveArea:()=>activeArea,getTargetGroup:()=>targetGroup,setSource:v=>{source=v;renderBag()}};\nconst baseInit=window.__pciBaseInit;");

    if(
      !phase2Source.includes("'Agro y Ambiente':{f:'agro_ambiente',dcj:true}") ||
      phase2Source.includes('if(m.dcj)return[];') ||
      !phase2Source.includes('window.PCIPhase2V28=') ||
      !phase2Source.includes('pci-phase2-groups-rendered') ||
      !phase2Source.includes('scope=tg&&tg.area===a?[tg]:gs') ||
      !phase2Source.includes("if(c.component==='FO')return hasFO(g)") ||
      !phase2Source.includes('data/formacion_general/${x}?v=20260911-44') ||
      !phase2Source.includes('window.__pciEnsurePrearm?.()') ||
      !phase2Source.includes("renderGroups();renderBag();selectionBar()")
    ) throw new Error('No se pudo aplicar la integración V44 de Fase 2.');

    html=html.replace("const STORAGE='pci-sa-v2-app-20260910-7';","const STORAGE='pci-sa-v2-app-20260910-21';");
    html=html.replace("data/materias-v2.json?v=20260910-7","data/materias-v2.json?v=20260911-44");
    html=html.replace(
      '<div class="notice"><strong>Importante:</strong> ubicar Historia de 1.º en C1 no la saca de la bolsa. Sigue disponible para C2. Lo mismo ocurre con todos los pares C1/C2, C3/C4, C5/C6, C7/C8, C9/C10. En las troncales, una sola asignación ocupa los dos cuatrimestres.</div>',
      '<div class="notice"><strong>Mapa inicial:</strong> la Formación General aparece prearmada y puede reorganizarse. Desde Nivel 3, las materias de Formación Orientada pueden integrarse a laboratorios de Ciencias Sociales o Ciencias Naturales del mismo año siempre que se preserven los mínimos de los espacios FO. En Formación Orientada, los laboratorios y talleres de Nivel 4 y Nivel 5 necesitan al menos dos asignaturas; en Nivel 3 pueden conformarse con una sola. Los espacios FO incompletos no permiten validar el Mapa de la Oferta. La asignación docente es opcional y se realiza sobre cada materia. La Fase 2 hereda exactamente la composición de cada agrupamiento y muestra solo los contenidos que le corresponden.</div>'
    );
    html=html.replace(
      '<div class="notice"><strong>Importante:</strong> ubicar Historia de 1.º en C1 no la saca de la bolsa. Sigue disponible para C2. Lo mismo ocurre con todos los pares C1/C2, C3/C4, C5/C6, C7/C8 y C9/C10. En las troncales, una sola asignación ocupa los dos cuatrimestres.</div>',
      '<div class="notice"><strong>Mapa inicial:</strong> la Formación General aparece prearmada y puede reorganizarse. Desde Nivel 3, las materias de Formación Orientada pueden integrarse a laboratorios de Ciencias Sociales o Ciencias Naturales del mismo año siempre que se preserven los mínimos de los espacios FO. En Formación Orientada, los laboratorios y talleres de Nivel 4 y Nivel 5 necesitan al menos dos asignaturas; en Nivel 3 pueden conformarse con una sola. Los espacios FO incompletos no permiten validar el Mapa de la Oferta. La asignación docente es opcional y se realiza sobre cada materia. La Fase 2 hereda exactamente la composición de cada agrupamiento y muestra solo los contenidos que le corresponden.</div>'
    );

    const closeScript='</scr'+'ipt>';
    html=html.replace('\ninit();\n'+closeScript,'\nwindow.__pciBaseInit=init;\n'+closeScript);

    const beforePhase2=moduleSources.slice(0,8).map(inline).join('');
    const afterPhase2=moduleSources.slice(8).map(inline).join('');
    html=html.replace('</body>',
      beforePhase2+
      inline(phase2Source)+
      afterPhase2+
      '<script>(async()=>{if(window.__pciBaseInit)await window.__pciBaseInit();window.dispatchEvent(new Event("pci-app-ready"));})();</scr'+'ipt>\n'+
      '</body>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><strong>Error al cargar la aplicación.</strong><p>'+String(error.message||error)+'</p></main>';
  }
})();
</script>
</body>
</html>
