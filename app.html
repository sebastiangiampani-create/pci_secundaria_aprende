<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12395c">
<title>PCI Secundaria Aprende V2</title>
</head>
<body>
<p style="font-family:system-ui;padding:24px">Cargando PCI Secundaria Aprende V2…</p>
<script>
(async()=>{
  try{
    const response=await fetch('app-core.html?v=20260910-12',{cache:'no-store'});
    if(!response.ok) throw new Error('No se pudo cargar la aplicación base.');
    let html=await response.text();

    // FO: un laboratorio y un taller por Nivel 3, 4 y 5.
    html=html.replace("{k:'foLab4',l:'FO · Laboratorio 4',a:t=>t===9||t===10},",'');
    html=html.replace("{k:'foTaller4',l:'FO · Taller 4',a:t=>t===9||t===10},",'');

    // Aclaración visible: los dos formatos son cuatrimestrales y van en cuatrimestres distintos.
    html=html.replace(
      '<span>Artes: C1,C2,C3,C4,C7,C8</span>',
      '<span>Artes: C1,C2,C3,C4,C7,C8</span><span>FO: 1 laboratorio + 1 taller por nivel, uno en cada cuatrimestre</span>'
    );
    html=html.replace(
      '<div class="rule"><strong>Formación Orientada:</strong> se construye dentro del PCI específico de esa orientación. Las reglas generales operan igual en todos los PCI.</div>',
      '<div class="rule"><strong>Formación Orientada:</strong> en cada Nivel 3, 4 y 5 hay un laboratorio y un taller. Ambos son cuatrimestrales y se ubican en cuatrimestres distintos del nivel: si el laboratorio va en el primero, el taller va en el segundo, o viceversa.</div>'
    );

    // Separa esta prueba del estado local anterior.
    html=html.replace("const STORAGE='pci-sa-v2-app-20260910-7';","const STORAGE='pci-sa-v2-app-20260910-12';");

    // Refuerzo operativo: dentro de cada nivel, Lab FO y Taller FO no pueden ocupar el mismo
    // cuatrimestre ni duplicarse en ambos. Se elige un cuatrimestre para cada formato.
    const patch=`
<script>
(function(){
  const baseValidTarget=validTarget;
  const pairs={
    foLab1:{other:'foTaller1',terms:[5,6]},foTaller1:{other:'foLab1',terms:[5,6]},
    foLab2:{other:'foTaller2',terms:[7,8]},foTaller2:{other:'foLab2',terms:[7,8]},
    foLab3:{other:'foTaller3',terms:[9,10]},foTaller3:{other:'foLab3',terms:[9,10]}
  };
  validTarget=function(slot,s){
    const match=slot.match(/^(fo(?:Lab|Taller)[123])-c(\\d+)$/);
    if(match){
      const key=match[1],term=Number(match[2]),cfg=pairs[key];
      if(cfg){
        const otherTerm=cfg.terms.find(x=>x!==term);
        const p=ensure(state.active).placements;
        const sameFormatOther=(p[key+'-c'+otherTerm]||[]).length>0;
        if(sameFormatOther)return[false,'Este formato FO ya fue ubicado en C'+otherTerm+'. En cada nivel se usa una sola vez.'];
        const otherFormatSame=(p[cfg.other+'-c'+term]||[]).length>0;
        if(otherFormatSame)return[false,'En este nivel el laboratorio y el taller FO deben quedar en cuatrimestres distintos. Elegí C'+otherTerm+'.'];
      }
    }
    return baseValidTarget(slot,s);
  };

  const baseRenderMatrix=renderMatrix;
  renderMatrix=function(){
    baseRenderMatrix();
    const p=ensure(state.active).placements;
    Object.entries(pairs).forEach(([key,cfg])=>{
      const [a,b]=cfg.terms;
      const aUsed=(p[key+'-c'+a]||[]).length>0;
      const bUsed=(p[key+'-c'+b]||[]).length>0;
      const otherA=(p[cfg.other+'-c'+a]||[]).length>0;
      const otherB=(p[cfg.other+'-c'+b]||[]).length>0;
      [[a,bUsed||otherA],[b,aUsed||otherB]].forEach(([term,blocked])=>{
        const el=document.querySelector('[data-slot="'+key+'-c'+term+'"]');
        if(el&&blocked){el.style.opacity='.38';el.style.background='#f4f6f8';}
      });
    });
  };
})();
<\/script>`;
    html=html.replace('</body>',patch+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><strong>Error al cargar la aplicación.</strong><p>'+String(error.message||error)+'</p></main>';
  }
})();
</script>
</body>
</html>
