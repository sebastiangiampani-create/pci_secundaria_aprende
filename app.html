<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12395c">
<title>PCI Secundaria Aprende V2</title>
</head>
<body>
<p style="font-family:system-ui;padding:24px">Cargando PCI Secundaria Aprende V2…</p>
<script>
(async()=>{
  try{
    const response=await fetch('app-core.html?v=20260910-19',{cache:'no-store'});
    if(!response.ok) throw new Error('No se pudo cargar la aplicación base.');
    let html=await response.text();

    // Estado nuevo: evita arrastrar configuraciones incompatibles de prototipos previos.
    html=html.replace("const STORAGE='pci-sa-v2-app-20260910-7';","const STORAGE='pci-sa-v2-app-20260910-19';");
    html=html.replace("data/materias-v2.json?v=20260910-7","data/materias-v2.json?v=20260910-19");

    html=html.replace(
      '<div class="notice"><strong>Importante:</strong> ubicar Historia de 1.º en C1 no la saca de la bolsa. Sigue disponible para C2. Lo mismo ocurre con todos los pares C1/C2, C3/C4, C5/C6, C7/C8 y C9/C10. En las troncales, una sola asignación ocupa los dos cuatrimestres.</div>',
      '<div class="notice"><strong>Composición por drag & drop:</strong> cuando una materia anual se incorpora a un laboratorio o taller cuatrimestral, el sistema replica esa misma materia en el espacio correspondiente del segundo cuatrimestre del nivel. Los espacios siguen siendo visualmente separados. Toda acción inválida se bloquea indicando la regla que se rompería.</div>'
    );

    // Frenamos el init original para cargar primero el motor V19.
    html=html.replace('\ninit();\n</script>','\nwindow.__pciBaseInit=init;\n</script>');
    html=html.replace('</body>',
      '<script src="src/v19-map.js?v=20260910-19"></script>\n'+
      '<script>if(window.__pciBaseInit) window.__pciBaseInit();</script>\n'+
      '</body>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><strong>Error al cargar la aplicación.</strong><p>'+String(error.message||error)+'</p></main>';
  }
})();
</script>
</body>
</html>
