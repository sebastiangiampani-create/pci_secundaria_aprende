<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12395c">
<title>PCI Secundaria Aprende V2</title>
</head>
<body>
<p style="font-family:system-ui;padding:24px">Cargando PCI Secundaria Aprende V2…</p>
<script>
(async()=>{
  try{
    const response=await fetch('app-core.html?v=20260910-16',{cache:'no-store'});
    if(!response.ok) throw new Error('No se pudo cargar la aplicación base.');
    let html=await response.text();

    // Estado nuevo para no arrastrar configuraciones de pruebas anteriores.
    html=html.replace("const STORAGE='pci-sa-v2-app-20260910-7';","const STORAGE='pci-sa-v2-app-20260910-16';");

    html=html.replace(
      '<span>Artes: C1,C2,C3,C4,C7,C8</span>',
      '<span>Artes: C1,C2,C3,C4,C7,C8</span><span>FO: N3 y N4 = 1 laboratorio + 1 taller; N5 = 2 laboratorios + 2 talleres</span><span>Proyecto de Vinculación: anual en Nivel 5</span>'
    );
    html=html.replace(
      '<div class="rule"><strong>Formación Orientada:</strong> se construye dentro del PCI específico de esa orientación. Las reglas generales operan igual en todos los PCI.</div>',
      '<div class="rule"><strong>Formación Orientada:</strong> Nivel 3: 1 laboratorio + 1 taller entre C5/C6. Nivel 4: 1 laboratorio + 1 taller entre C7/C8. Nivel 5: C9 tiene 1 laboratorio + 1 taller y C10 tiene 1 laboratorio + 1 taller; por eso Nivel 5 totaliza 2 laboratorios + 2 talleres.</div><div class="rule"><strong>Proyecto de Vinculación:</strong> es un único espacio anual de Nivel 5. Atraviesa C9 y C10 como las materias troncales anuales; no se divide en dos proyectos cuatrimestrales.</div><div class="rule"><strong>Tope de laboratorios:</strong> ningún laboratorio puede superar las 9 horas cátedra. La carga horaria se usa como dato interno de validación y no se muestra en la bolsa.</div>'
    );

    const patch=`
<script>
(function(){
  function foOrders(){
    const m=ensure(state.active);
    m.foOrder=m.foOrder||{3:'lab-first',4:'lab-first'};
    return m.foOrder;
  }
  function foTerms(level){return level===3?[5,6]:[7,8]}
  function foType(level,term){
    const [a,b]=foTerms(level),labFirst=foOrders()[level]!=='taller-first';
    if(term===a)return labFirst?'lab':'taller';
    if(term===b)return labFirst?'taller':'lab';
    return null;
  }

  rowDefs=function(){
    const mode=ensure(state.active).mode;
    return[
      {k:'lengua',l:'Lengua y Literatura',annual:true},
      {k:'matematica',l:'Matemática',annual:true},
      {k:'adicional',l:'Lengua Adicional',annual:true},
      {k:'naturales',l:'Laboratorios · Ciencias Naturales',a:t=>true},
      {k:'socialA',l:mode==='split'?'Ciencias Sociales · Laboratorio A':'Laboratorios · Ciencias Sociales',a:t=>true},
      {k:'socialB',l:'Ciencias Sociales · Laboratorio B',a:t=>mode==='split'&&(t===5||t===6)},
      {k:'artes',l:'Talleres · Artes',a:t=>ARTS.has(t)},
      {k:'tecnologias',l:'Talleres · Tecnologías',a:t=>true},
      {k:'ef',l:'Talleres · Educación Física',a:t=>true},
      {k:'otros',l:'Otros formatos pedagógicos',a:t=>true},
      {k:'foN3',l:'Formación Orientada · Nivel 3',a:t=>t===5||t===6},
      {k:'foN4',l:'Formación Orientada · Nivel 4',a:t=>t===7||t===8},
      {k:'foLab5',l:'FO · Laboratorios · Nivel 5',a:t=>t===9||t===10},
      {k:'foTaller5',l:'FO · Talleres · Nivel 5',a:t=>t===9||t===10},
      {k:'proyecto',l:'Proyecto de Vinculación',annualLevel:5}
    ];
  };

  const baseLabel=label;
  label=function(k,t){
    if(k==='foN3'||k==='foN4'){
      const level=Number(k.slice(-1));
      return (foType(level,t)==='lab'?'Laboratorio FO':'Taller FO')+' · C'+t;
    }
    if(k==='foLab5')return 'Laboratorio FO · C'+t;
    if(k==='foTaller5')return 'Taller FO · C'+t;
    return baseLabel(k,t);
  };

  const baseValidTarget=validTarget;
  validTarget=function(slot,s){
    if(slot==='proyecto-n5'){
      if(s.year!==5)return[false,'El Proyecto de Vinculación corresponde al Nivel 5.'];
      if(s.origin!=='FO')return[false,'El Proyecto de Vinculación recibe materializaciones de Formación Orientada de 5.º.'];
      return[true,''];
    }
    let match=slot.match(/^foN([34])-c(\\d+)$/);
    if(match){
      const level=Number(match[1]),term=Number(match[2]);
      if(s.year!==level)return[false,'Esta materia corresponde a '+s.year+'.º y este espacio pertenece al Nivel '+level+'.'];
      const c=classify(s);
      if(level===3 && ensure(state.active).mode==='articulated' && c==='social')return[true,''];
      if(s.origin==='FO')return[true,''];
      return[false,(foType(level,term)==='lab'?'El Laboratorio FO':'El Taller FO')+' recibe materializaciones de Formación Orientada'+(level===3?' y, en la opción articulada, una materia de Ciencias Sociales.':'.')];
    }
    match=slot.match(/^(foLab5|foTaller5)-c(9|10)$/);
    if(match){
      if(s.year!==5)return[false,'Este espacio pertenece al Nivel 5.'];
      if(s.origin!=='FO')return[false,'Este espacio recibe materializaciones de Formación Orientada de 5.º.'];
      return[true,''];
    }
    return baseValidTarget(slot,s);
  };

  renderMatrix=function(){
    let h='<div class="grid levels"><div></div>';
    for(let y=1;y<=5;y++)h+='<div class="level">Nivel '+y+'</div>';
    h+='</div><div class="grid"><div class="term">Espacio</div>';
    for(let t=1;t<=10;t++)h+='<div class="term">C'+t+'</div>';
    h+='</div>';
    for(const r of rowDefs()){
      h+='<div class="grid"><div class="rowlabel">'+esc(r.l)+'</div>';
      if(r.annual){
        for(let y=1;y<=5;y++){
          const slot=r.k+'-n'+y;
          h+='<div class="cell annual"><div class="drop" data-slot="'+slot+'"><strong>C'+(y*2-1)+'+C'+(y*2)+'</strong>'+placed(slot)+'</div></div>';
        }
      }else if(r.annualLevel){
        for(let y=1;y<=5;y++){
          if(y===r.annualLevel){
            const slot=r.k+'-n'+y;
            h+='<div class="cell annual"><div class="drop" data-slot="'+slot+'"><strong>Anual · C'+(y*2-1)+'+C'+(y*2)+'</strong>'+placed(slot)+'</div></div>';
          }else{
            h+='<div class="cell inactive">—</div><div class="cell inactive">—</div>';
          }
        }
      }else{
        for(let t=1;t<=10;t++){
          if(r.a(t)){
            const slot=r.k+'-c'+t;
            h+='<div class="cell"><div class="drop" data-slot="'+slot+'"><strong>'+label(r.k,t)+'</strong>'+placed(slot)+'</div></div>';
          }else h+='<div class="cell inactive">—</div>';
        }
      }
      h+='</div>';
    }
    $('matrix').innerHTML=h;
    $('matrix').querySelectorAll('.drop').forEach(z=>{
      z.ondragover=e=>{e.preventDefault();z.classList.add('ready')};
      z.ondragleave=()=>z.classList.remove('ready');
      z.ondrop=e=>{e.preventDefault();z.classList.remove('ready');assign(z.dataset.slot,e.dataTransfer.getData('text/plain')||picked)};
      z.onclick=e=>{if(e.target.closest('[data-rm]'))return;if(picked)assign(z.dataset.slot,picked)};
    });
    $('matrix').querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();removeOne(b.dataset.slot,b.dataset.rm)});
  };

  function socialAt(slot){
    return new Set((ensure(state.active).placements[slot]||[])
      .map(byId).filter(Boolean)
      .filter(s=>SOCIAL.has(s.name)&&s.year===3)
      .map(s=>s.name));
  }
  function fo3Count(slot){
    return(ensure(state.active).placements[slot]||[])
      .map(byId).filter(Boolean)
      .filter(s=>s.origin==='FO'&&s.year===3).length;
  }
  const sameSet=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));

  validateSocial=function(){
    const m=ensure(state.active),A5=socialAt('socialA-c5'),A6=socialAt('socialA-c6'),B5=socialAt('socialB-c5'),B6=socialAt('socialB-c6'),F5=socialAt('foN3-c5'),F6=socialAt('foN3-c6'),all=new Set(['Historia','Geografía','Formación Ética y Ciudadana','Economía']);
    if(fo3Count('foN3-c5')<1||fo3Count('foN3-c6')<1)return{ok:false,msg:'Nivel 3: ubicá la materialización FO en C5 y C6. Un cuatrimestre funciona como Laboratorio y el otro como Taller.'};
    if(m.mode==='one'){
      return sameSet(A5,all)&&sameSet(A6,all)&&F5.size===0&&F6.size===0
        ?{ok:true,msg:'Nivel 3 válido: Sociales reúne las 4 materias; la FO tiene 1 laboratorio + 1 taller entre C5/C6.'}
        :{ok:false,msg:'Sociales Nivel 3: ubicá Historia, Geografía, FEC y Economía juntas en C5 y C6.'};
    }
    if(m.mode==='split'){
      const u5=new Set([...A5,...B5]),u6=new Set([...A6,...B6]);
      const ok=A5.size===2&&B5.size===2&&A6.size===2&&B6.size===2&&sameSet(u5,all)&&sameSet(u6,all)&&sameSet(A5,A6)&&sameSet(B5,B6)&&F5.size===0&&F6.size===0;
      return ok?{ok:true,msg:'Nivel 3 válido: Sociales 2+2; la FO tiene 1 laboratorio + 1 taller entre C5/C6.'}:{ok:false,msg:'Sociales Nivel 3: armá libremente dos parejas 2+2 y mantené la misma conformación en C5 y C6.'};
    }
    const u5=new Set([...A5,...F5]),u6=new Set([...A6,...F6]);
    const ok=A5.size===3&&A6.size===3&&F5.size===1&&F6.size===1&&sameSet(u5,all)&&sameSet(u6,all)&&sameSet(A5,A6)&&sameSet(F5,F6);
    return ok?{ok:true,msg:'Nivel 3 válido: 3 materias sociales juntas + 1 articulada con FO; la FO tiene 1 laboratorio + 1 taller entre C5/C6.'}:{ok:false,msg:'Nivel 3 articulado: dejá 3 materias en Sociales y 1 junto con la materialización FO, con la misma conformación en C5 y C6.'};
  };

  renderSocial=function(){
    const m=ensure(state.active);
    document.querySelectorAll('#socialModes [data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m.mode));
    const help={
      one:'Sociales reúne las cuatro materias. La FO de 3.º tiene un solo laboratorio y un solo taller en total: uno en C5 y el otro en C6.',
      split:'Sociales se divide libremente 2+2. La FO de 3.º mantiene un solo laboratorio y un solo taller entre C5 y C6.',
      articulated:'Una materia social articula con FO y las otras tres quedan juntas. La FO de 3.º mantiene un solo laboratorio y un solo taller entre C5 y C6.'
    };
    $('socialHelp').textContent=help[m.mode];
    const A5=[...socialAt('socialA-c5')],B5=[...socialAt('socialB-c5')],F5=[...socialAt('foN3-c5')];
    $('socialStatus').innerHTML=m.mode==='one'
      ?'<div><strong>Social C5</strong><br>'+(A5.length?esc(A5.join(' + ')):'Todavía vacío')+'</div><div><strong>FO Nivel 3</strong><br>'+label('foN3',5)+' / '+label('foN3',6)+'</div>'
      :m.mode==='split'
      ?'<div><strong>Grupo A · C5</strong><br>'+(A5.length?esc(A5.join(' + ')):'Elegí 2 materias')+'</div><div><strong>Grupo B · C5</strong><br>'+(B5.length?esc(B5.join(' + ')):'Elegí las otras 2')+'</div>'
      :'<div><strong>Sociales FG · C5</strong><br>'+(A5.length?esc(A5.join(' + ')):'Elegí 3 materias')+'</div><div><strong>Articulada con FO · C5</strong><br>'+(F5.length?esc(F5.join(' + ')):'Elegí 1 materia social')+'</div>';
  };

  copyC5C6=function(){
    const m=ensure(state.active);
    for(const base of['socialA','socialB']){
      const from=base+'-c5',to=base+'-c6';
      const ids=(m.placements[from]||[]).filter(id=>{const s=byId(id);return s&&SOCIAL.has(s.name)});
      if(ids.length)m.placements[to]=[...ids];
    }
    const foIds=(m.placements['foN3-c5']||[]).filter(id=>{const s=byId(id);return s&&(s.origin==='FO'||SOCIAL.has(s.name))});
    if(foIds.length)m.placements['foN3-c6']=[...foIds];
    m.valid=false;save();renderOffer();toast('Se copió la conformación de C5 a C6.');
  };

  function renderFoOrderControls(){
    const toolbar=document.querySelector('.matrix-toolbar');if(!toolbar)return;
    let box=document.getElementById('foOrderControls');
    if(!box){
      box=document.createElement('div');
      box.id='foOrderControls';
      box.style.cssText='width:100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px';
      toolbar.appendChild(box);
    }
    const order=foOrders();
    box.innerHTML=[3,4].map(level=>{
      const[a,b]=foTerms(level),labFirst=order[level]!=='taller-first';
      return '<button type="button" class="btn small soft" data-fo-order="'+level+'">Nivel '+level+': '+(labFirst?'Lab C'+a+' · Taller C'+b:'Taller C'+a+' · Lab C'+b)+' ↔</button>';
    }).join('')+'<span class="status">Nivel 5: Lab + Taller en C9 y Lab + Taller en C10</span><span class="status">Proyecto de Vinculación: anual C9+C10</span>';
    box.querySelectorAll('[data-fo-order]').forEach(btn=>btn.onclick=()=>{
      const level=Number(btn.dataset.foOrder),[a,b]=foTerms(level),key='foN'+level,p=ensure(state.active).placements;
      const tmp=p[key+'-c'+a]||[];p[key+'-c'+a]=p[key+'-c'+b]||[];p[key+'-c'+b]=tmp;
      order[level]=order[level]==='taller-first'?'lab-first':'taller-first';
      ensure(state.active).valid=false;save();renderOffer();toast('Se invirtió el orden FO de Nivel '+level+'.');
    });
  }

  const baseRenderOffer=renderOffer;
  renderOffer=function(){baseRenderOffer();renderFoOrderControls()};
})();
<\/script>`;

    html=html.replace('</body>',patch+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><strong>Error al cargar la aplicación.</strong><p>'+String(error.message||error)+'</p></main>';
  }
})();
</script>
</body>
</html>
