name: Browser JavaScript check

on:
  push:
    branches:
      - feature/v48-institucional
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check V54 entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "src/v48-institutional-layer.js" app.html
          grep -q "src/v48-phase2-institutional-content.js" app.html
          grep -q "src/v52-derived-teacher-load.js" app.html
          grep -q "src/v51-school-timetable-config.js" app.html
          grep -q "src/v49-teacher-availability.js" app.html
          grep -q "src/v50-schedule-generator.js" app.html
          grep -q "src/v53-institutional-work-scheduler.js" app.html
          grep -q "src/v54-auto-area-coincidence.js" app.html
          grep -q "20260912-54" app.html
          grep -q "20260912-54" index.html
      - name: Check institutional V54 rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "outsideWork" src/v53-institutional-work-scheduler.js
          grep -q "maxTotalHours" src/v53-institutional-work-scheduler.js
          grep -q "AREA_BY_SLOT" src/v54-auto-area-coincidence.js
          grep -q "auto-fg-" src/v54-auto-area-coincidence.js
          grep -q "auto-fo-" src/v54-auto-area-coincidence.js
          grep -q "value=\"3\"" src/v54-auto-area-coincidence.js
          grep -q "value=\"4\"" src/v54-auto-area-coincidence.js
      - name: Smoke test legacy schedule generator
        run: node tests/v50-generator-smoke.cjs
