name: Browser JavaScript check

on:
  push:
    branches:
      - main
      - feature/v48-institucional
      - feature/v66-institucional-general
      - feature/v69-big-block-fixes
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check V69 entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "app-v69.html?v=20260914-69" index.html
          grep -Fq "20260914-69" app-v69.html
          grep -Fq "fetch('app.html?v=20260914-69'" app-v69.html
          ! grep -Fq "app-v68.html" app-v69.html
          grep -Fq "src/v66-institutional-general.js" app-v69.html
          grep -Fq "src/v68-staff-planning.js" app-v69.html
          grep -Fq "src/v68-annual-scheduler.js" app-v69.html
          grep -Fq "src/v68-institutional-export.js" app-v69.html
          grep -Fq "src/v68-runtime-fix.js" app-v69.html
          grep -Fq "src/v69-tutoria-contents.js" app-v69.html
          grep -Fq "src/v69-ux-workflow.js" app-v69.html
          test -f data/tutoria.json
          grep -Fq '"id":"tutoria-001"' data/tutoria.json
          grep -Fq '"id":"tutoria-035"' data/tutoria.json
      - name: Check V68 institutional contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'src/v54-auto-area-coincidence.js':['subjectFO','auto-fg-','auto-fo-'],
            'src/v65-annual-offer.js':['planningResidualRows','PCIStaffPlanningV68','minimumOutside=team+explicit'],
            'src/v66-institutional-general.js':['Implementación institucional general','allImplementationRows','openInstitutionalGeneral'],
            'src/v68-staff-planning.js':['function demand()','function teacherPlanning(','function buildProposal(','function simulateProposal(','assignmentLocks','planningOverrides','state.institutional'],
            'src/v68-annual-scheduler.js':['function simulateAssignments(','proposalMode','allowMinimumOffer',"engine:'v68-annual'",'teamCommonHours'],
            'src/v68-institutional-export.js':["add('Demanda'","add('Perfiles'","add('Planificacion'","add('Propuesta'",'respaldo-completo-v68'],
            'src/v68-runtime-fix.js':['Extra-plan','simulateAssignments','syncProfileFields']
          };
          for(const [file,needles] of Object.entries(checks)){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of needles){
              if(!text.includes(needle))throw new Error(`${file}: falta contrato ${needle}`);
              console.log(`OK ${file}: ${needle}`);
            }
          }
          NODE
      - name: Check V69 UX contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const tutor=fs.readFileSync('src/v69-tutoria-contents.js','utf8');
          for(const needle of ['data/tutoria.json','contenidos oficiales de Tutoría','allowedLevels','PCITutoriaContentsV69']){
            if(!tutor.includes(needle))throw new Error(`Tutoría V69: falta ${needle}`);
          }
          const ux=fs.readFileSync('src/v69-ux-workflow.js','utf8');
          for(const needle of ['Volver al panel del PCI','Descargar modelo Excel','Importar Excel / CSV','v69-collapsed','A4 landscape','Imprimir matriz apaisada','PCIUXWorkflowV69']){
            if(!ux.includes(needle))throw new Error(`UX V69: falta ${needle}`);
          }
          const imp=fs.readFileSync('src/v64-teacher-import.js','utf8');
          for(const needle of ['Descargar plantilla Excel','Subir Excel / CSV','downloadTemplate']){
            if(!imp.includes(needle))throw new Error(`Importación docente: falta ${needle}`);
          }
          console.log('OK: V69 conserva Tutoría oficial, navegación, acordeones, importación y salida apaisada.');
          NODE
      - name: Check protected PCI core remains wired
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.html','utf8');
          for(const needle of ['src/v47-phase2-matrix.js','src/v59-phase2-annual-matrix.js','src/v48-institutional-layer.js']){
            if(!app.includes(needle))throw new Error(`app.html: falta ${needle}`);
          }
          const staff=fs.readFileSync('src/v68-staff-planning.js','utf8');
          if(!staff.includes('state.institutional'))throw new Error('V68 debe persistir dentro de state.institutional.');
          if(/placements\s*=\s*\{/.test(staff))throw new Error('V68 no debe reemplazar placements de Fase 1.');
          const ux=fs.readFileSync('src/v69-ux-workflow.js','utf8');
          if(/placements\s*=\s*\{/.test(ux))throw new Error('V69 UX no debe reemplazar placements de Fase 1.');
          console.log('OK: V69 agrega UX sin reemplazar el núcleo PCI.');
          NODE
      - name: Smoke test legacy schedule generator
        run: node tests/v50-generator-smoke.cjs
