name: Browser JavaScript check

on:
  push:
    branches:
      - feature/v48-institucional
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check V57 entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "src/v48-institutional-layer.js" app.html
          grep -q "src/v48-phase2-institutional-content.js" app.html
          grep -q "src/v57-custom-divisions.js" app.html
          grep -q "src/v52-derived-teacher-load.js" app.html
          grep -q "src/v51-school-timetable-config.js" app.html
          grep -q "src/v49-teacher-availability.js" app.html
          grep -q "src/v53-institutional-work-scheduler.js" app.html
          grep -q "src/v54-auto-area-coincidence.js" app.html
          grep -q "src/v55-contiguous-area-blocks.js" app.html
          grep -q "src/v56-offer-model.js" app.html
          grep -q "20260912-57" app.html
          grep -q "20260912-57" index.html
      - name: Check institutional V57 rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AREA_BY_SLOT" src/v54-auto-area-coincidence.js
          grep -q "auto-fg-" src/v54-auto-area-coincidence.js
          grep -q "auto-fo-" src/v54-auto-area-coincidence.js
          grep -q "commonBlocks" src/v55-contiguous-area-blocks.js
          grep -q "bloque continuo" src/v55-contiguous-area-blocks.js
          grep -q "mandatoryOutside=team+explicit" src/v56-offer-model.js
          grep -q "minimumTotal=front+mandatoryOutside" src/v56-offer-model.js
          grep -q "maxOptional=Math.floor(front\*.5)" src/v56-offer-model.js
          grep -q "offerPctBySemester" src/v56-offer-model.js
          grep -q "divisionLabels" src/v57-custom-divisions.js
          grep -q "Personalizar nombres de divisiones" src/v57-custom-divisions.js
      - name: Smoke test legacy schedule generator
        run: node tests/v50-generator-smoke.cjs
