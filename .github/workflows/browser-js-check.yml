name: Browser JavaScript check

on:
  push:
    branches:
      - main
      - feature/v48-institucional
      - feature/v66-institucional-general
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check V68 entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "app-v68.html?v=20260914-68" index.html
          grep -Fq "20260914-68" app-v68.html
          grep -Fq "fetch('app.html?v=20260914-68'" app-v68.html
          ! grep -Fq "app-v67.html" app-v68.html
          grep -Fq "src/v66-institutional-general.js" app-v68.html
          grep -Fq "src/v68-staff-planning.js" app-v68.html
          grep -Fq "src/v68-annual-scheduler.js" app-v68.html
          grep -Fq "src/v68-institutional-export.js" app-v68.html
          grep -Fq "src/v68-runtime-fix.js" app-v68.html
          grep -Fq "src/v48-institutional-layer.js" app.html
          grep -Fq "src/v48-phase2-institutional-content.js" app.html
          grep -Fq "src/v59-phase2-annual-matrix.js" app.html
      - name: Check V68 institutional contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'src/v54-auto-area-coincidence.js':['subjectFO','auto-fg-','auto-fo-'],
            'src/v65-annual-offer.js':['planningResidualRows','PCIStaffPlanningV68','minimumOutside=team+explicit'],
            'src/v66-institutional-general.js':['Implementación institucional general','allImplementationRows','openInstitutionalGeneral'],
            'src/v68-staff-planning.js':['function demand()','function teacherPlanning(','function buildProposal(','function simulateProposal(','assignmentLocks','planningOverrides','state.institutional'],
            'src/v68-annual-scheduler.js':['function simulateAssignments(','proposalMode','allowMinimumOffer',"engine:'v68-annual'",'teamCommonHours'],
            'src/v68-institutional-export.js':["add('Demanda'","add('Perfiles'","add('Planificacion'","add('Propuesta'",'respaldo-completo-v68'],
            'src/v68-runtime-fix.js':['Extra-plan','simulateAssignments','syncProfileFields']
          };
          for(const [file,needles] of Object.entries(checks)){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of needles){
              if(!text.includes(needle))throw new Error(`${file}: falta contrato ${needle}`);
              console.log(`OK ${file}: ${needle}`);
            }
          }
          NODE
      - name: Check protected PCI core remains wired
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.html','utf8');
          for(const needle of ['src/v47-phase2-matrix.js','src/v59-phase2-annual-matrix.js','src/v48-institutional-layer.js']){
            if(!app.includes(needle))throw new Error(`app.html: falta ${needle}`);
          }
          const staff=fs.readFileSync('src/v68-staff-planning.js','utf8');
          if(!staff.includes('state.institutional'))throw new Error('V68 debe persistir dentro de state.institutional.');
          if(/placements\s*=\s*\{/.test(staff))throw new Error('V68 no debe reemplazar placements de Fase 1.');
          console.log('OK: V68 persiste en la capa institucional y conserva el núcleo PCI.');
          NODE
      - name: Smoke test legacy schedule generator
        run: node tests/v50-generator-smoke.cjs
