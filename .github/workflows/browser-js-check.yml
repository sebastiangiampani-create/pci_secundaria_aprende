name: Browser JavaScript check

on:
  push:
    branches:
      - feature/v48-institucional
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check V52 entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "src/v48-institutional-layer.js" app.html
          grep -q "src/v48-phase2-institutional-content.js" app.html
          grep -q "src/v52-derived-teacher-load.js" app.html
          grep -q "src/v51-school-timetable-config.js" app.html
          grep -q "src/v49-teacher-availability.js" app.html
          grep -q "src/v50-schedule-generator.js" app.html
          grep -q "20260912-52" app.html
          grep -q "20260912-52" index.html
      - name: Smoke test schedule generator
        run: node tests/v50-generator-smoke.cjs
