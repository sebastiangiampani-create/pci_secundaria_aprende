name: Browser JavaScript check

on:
  push:
    branches:
      - feature/v48-institucional
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check V58 entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "src/v48-institutional-layer.js" app.html
          grep -Fq "src/v48-phase2-institutional-content.js" app.html
          grep -Fq "src/v57-custom-divisions.js" app.html
          grep -Fq "src/v52-derived-teacher-load.js" app.html
          grep -Fq "src/v51-school-timetable-config.js" app.html
          grep -Fq "src/v49-teacher-availability.js" app.html
          grep -Fq "src/v53-institutional-work-scheduler.js" app.html
          grep -Fq "src/v54-auto-area-coincidence.js" app.html
          grep -Fq "src/v58-parallel-phases.js" app.html
          grep -Fq "src/v55-contiguous-area-blocks.js" app.html
          grep -Fq "src/v56-offer-model.js" app.html
          grep -Fq "20260912-58" app.html
          grep -Fq "20260912-58" index.html
      - name: Check institutional V58 rules
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "AREA_BY_SLOT" src/v54-auto-area-coincidence.js
          grep -Fq "auto-fg-" src/v54-auto-area-coincidence.js
          grep -Fq "auto-fo-" src/v54-auto-area-coincidence.js
          grep -Fq "commonBlocks" src/v55-contiguous-area-blocks.js
          grep -Fq "bloque continuo" src/v55-contiguous-area-blocks.js
          grep -Fq "minimumOutside=team+explicit" src/v56-offer-model.js
          grep -Fq "minimumTotal=front+minimumOutside" src/v56-offer-model.js
          grep -Fq "maxOutside=Math.floor(front*.5)" src/v56-offer-model.js
          grep -Fq "offerPctBySemester" src/v56-offer-model.js
          grep -Fq "divisionLabels" src/v57-custom-divisions.js
          grep -Fq "Personalizar nombres de divisiones" src/v57-custom-divisions.js
          grep -Fq "proposalCard?.classList.remove('locked')" src/v58-parallel-phases.js
          grep -Fq "institutionalCard?.classList.remove('locked')" src/v58-parallel-phases.js
          grep -Fq "offer.minimumOutside" src/v58-parallel-phases.js
          grep -Fq "50 % de la carga frente a curso" src/v58-parallel-phases.js
      - name: Smoke test legacy schedule generator
        run: node tests/v50-generator-smoke.cjs
